name: studies

# Lives in the PUBLIC repo (free Actions minutes); code and data are in the PRIVATE repo (see perp.yml).

on:
  workflow_dispatch:          # "Run workflow" button in the Actions tab
    inputs:
      task:
        description: "report = the weekly study; whale-backfill = fill older hourly whale history (not on Saturdays: shares the 100 a day)"
        type: choice
        options: [report, whale-backfill]
        default: report
  schedule:
    - cron: "17 0 * * 6"      # every Saturday 00:17 UTC = 09:17 KST. SoSoValue keeps one month, so a weekly run never misses a day

concurrency:
  group: studies               # a manual run and the schedule never write to the private repo at the same time
  cancel-in-progress: false

env:
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  # Telegram sender, run as: python -c "$TG_PY" TEXT_OR_TXT_FILE [FILE...]
  # Sends the text (a .txt file's contents, or the text itself), then each file as a document. Standard library only.
  TG_PY: |
    import json, os, sys, uuid, urllib.error, urllib.parse, urllib.request
    tok, chat = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip(), os.environ.get("TELEGRAM_CHAT_ID", "").strip()
    if not tok or not chat:
        sys.exit("The TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID secrets are empty in this repo")
    text, files = sys.argv[1], [f for f in sys.argv[2:] if os.path.exists(f)]
    if text.endswith(".txt") and os.path.exists(text):
        text = open(text, encoding="utf-8").read()
    def call(method, fields, path=None):
        if path is None:
            req = urllib.request.Request(f"https://api.telegram.org/bot{tok}/{method}", data=urllib.parse.urlencode(fields).encode())
        else:
            b = uuid.uuid4().hex
            body = b"".join(f'--{b}\r\nContent-Disposition: form-data; name="{k}"\r\n\r\n{v}\r\n'.encode() for k, v in fields.items())
            body += (f'--{b}\r\nContent-Disposition: form-data; name="document"; filename="{os.path.basename(path)}"\r\n'
                     f'Content-Type: application/octet-stream\r\n\r\n').encode() + open(path, "rb").read() + f"\r\n--{b}--\r\n".encode()
            req = urllib.request.Request(f"https://api.telegram.org/bot{tok}/{method}", data=body,
                                         headers={"Content-Type": f"multipart/form-data; boundary={b}"})
        try:
            with urllib.request.urlopen(req, timeout=120) as r:
                return json.load(r)
        except urllib.error.HTTPError as e:            # never print the URL: it contains the bot token
            sys.exit(f"Telegram refused {method}: HTTP {e.code} {e.read()[:200]!r}")
    if files and len(text) <= 1000:                    # short text rides along as the file's caption
        call("sendDocument", {"chat_id": chat, "caption": text}, files[0])
        files = files[1:]
    else:
        for i in range(0, min(len(text), 12000), 4000):
            call("sendMessage", {"chat_id": chat, "text": text[i:i + 4000], "disable_web_page_preview": "true"})
    for f in files:
        call("sendDocument", {"chat_id": chat}, f)
    print("Sent to Telegram:", len(text), "characters,", len(sys.argv[2:]), "file(s)")

jobs:
  etf:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read          # this repo is only read; the private repo is written with the PRIVATE_PAT token
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_PAT }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests openpyxl
      - name: ETF flow vs price study (the log is kept in the private repo, not printed here)
        if: inputs.task != 'whale-backfill'
        env:
          SOSO_API_KEY: ${{ secrets.SOSO_API_KEY }}
          HYPERTRACKER_TOKEN: ${{ secrets.HYPERTRACKER_TOKEN }}
          COINALYZE_API_KEY: ${{ secrets.COINALYZE_API_KEY }}
          FRED_API_KEY: ${{ secrets.FRED_API_KEY }}
        run: |
          mkdir -p data/studies
          set +e
          python etf_gap_study.py \
            --soso-base "${{ vars.SOSO_BASE || 'https://openapi.sosovalue.com/openapi/v1' }}" \
            --out etf_gap_study.xlsx > data/studies/etf_last_run.log 2>&1
          code=$?
          echo "etf_gap_study.py finished with exit code $code. Full log: data/studies/etf_last_run.log in the private repo."
          exit $code
      - name: Whale history backfill (about 3 runs on separate days fill 4 weeks)
        if: inputs.task == 'whale-backfill'
        env:
          HYPERTRACKER_TOKEN: ${{ secrets.HYPERTRACKER_TOKEN }}
        run: |
          mkdir -p data/studies
          python whale_scanner.py --backfill 28 90 > data/studies/whale_backfill.log 2>&1
          code=$?
          echo "whale_scanner.py --backfill finished with exit code $code"
          exit $code
      - name: Save flow history to the repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add -A data/ 2>/dev/null || true                    # -A: also records files moved out of data/ into data/studies/
          if git diff --cached --quiet; then
            echo "No new flow data"
          else
            git commit -q -m "studies data $(date -u +%F)"          # -q: no file list in the public log
            for i in 1 2 3; do git pull -q --rebase && git push -q && break; git rebase --abort 2>/dev/null; sleep 5; done
          fi
      - name: Send the report to Telegram
        if: inputs.task != 'whale-backfill'
        run: python -c "$TG_PY" etf_gap_study.txt etf_gap_study.xlsx
      - name: Send the backfill result to Telegram
        if: inputs.task == 'whale-backfill'
        run: python -c "$TG_PY" "Whale history $(tail -n 1 data/studies/whale_backfill.log)"
      - name: Send a failure notice to Telegram
        if: failure()
        run: |                  # the log is not public, so the message carries its last lines
          log=data/studies/etf_last_run.log
          if [ "${{ inputs.task }}" = "whale-backfill" ]; then log=data/studies/whale_backfill.log; fi
          python -c "$TG_PY" "$(printf 'studies run FAILED. Run page: %s\n\nLast lines of the log:\n' "$RUN_URL"; tail -n 40 "$log" 2>/dev/null || echo '(no log)')"

