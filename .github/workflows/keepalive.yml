name: keepalive

# GitHub switches scheduled workflows off in a public repo after 60 days without repository activity.
# This job runs twice a month, re-enables the schedules through the API and also commits a timestamp.

on:
  schedule:
    - cron: "17 3 1,15 * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

jobs:
  keepalive:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Re-enable the schedules
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          for f in perp.yml intraday.yml keepalive.yml; do
            gh api -X PUT "repos/${{ github.repository }}/actions/workflows/$f/enable" || true
          done
      - name: Commit a timestamp
        run: |
          date -u +"%Y-%m-%d %H:%M UTC" > keepalive.txt
          git config user.name "keepalive-bot"
          git config user.email "keepalive-bot@users.noreply.github.com"
          git add keepalive.txt
          if ! git diff --cached --quiet; then git commit -m "keepalive" && git push || true; fi
