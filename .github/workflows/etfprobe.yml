name: etf-probe
# One-off check of where the daily ETF flow numbers can be read from (reachability + what the newest rows look like). Public data only; no secrets are printed.
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - run: pip install requests
      - name: Probe
        env:
          SOSO_API_KEY: ${{ secrets.SOSO_API_KEY }}
        run: |
          python - <<'PY'
          import os, re, json, requests
          key = os.environ.get("SOSO_API_KEY", "").strip()
          print("SOSO key set:", bool(key))
          for sym in ("BTC", "ETH", "SOL"):
              try:
                  r = requests.get("https://openapi.sosovalue.com/openapi/v1/etfs/summary-history", params={"symbol": sym, "country_code": "US"}, headers={"x-soso-api-key": key}, timeout=40)
                  b = r.json()
                  rows = b.get("data", b) if isinstance(b, dict) else b
                  if isinstance(rows, dict):
                      rows = next((v for v in rows.values() if isinstance(v, list)), [])
                  print("SoSoValue", sym, "HTTP", r.status_code, "code", b.get("code") if isinstance(b, dict) else "?", "rows", len(rows or []))
                  for x in (rows or [])[:6]:
                      print("   ", {k: x.get(k) for k in list(x)[:6]})
                  if rows:
                      print("    keys:", sorted(rows[0].keys()))
              except Exception as e:
                  print("SoSoValue", sym, "failed:", type(e).__name__, str(e)[:150])
          H = {"User-Agent": "Mozilla/5.0 (X11; Linux x86_64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124 Safari/537.36"}
          import html as _h
          for sym in ("btc", "eth", "sol"):
              r = requests.get(f"https://farside.co.uk/{sym}/", headers=H, timeout=40)
              t = r.text
              print("Farside", sym, r.status_code, len(t))
              trs = re.findall(r"<tr[^>]*>(.*?)</tr>", t, re.S)
              out = []
              for tr in trs:
                  cells = [re.sub(r"\s+", " ", _h.unescape(re.sub(r"<[^>]+>", "", c))).strip() for c in re.findall(r"<t[dh][^>]*>(.*?)</t[dh]>", tr, re.S)]
                  out.append(cells)
              print("  table rows:", len(out), " widths:", sorted({len(c) for c in out}))
              for c in out[:3] + out[-7:]:
                  print("   ", c)
              # the other tables on the page
              print("  <table count:", t.count("<table"))
