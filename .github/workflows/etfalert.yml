name: etf-alert

# Lives in the PUBLIC repo (free Actions minutes); code and state are in the PRIVATE repo (checked out with PRIVATE_PAT).
# Telegram message (bot 3) with the last 5 daily US spot-ETF flows (BTC and ETH) right after the newest day's number is published (etf_alert.py).
# Polls every 10 minutes from 05:00 to 14:00 KST, Tuesday to Saturday (the US close is 05:00-06:00 KST). Quick when there is nothing new.

on:
  schedule:
    - cron: "*/10 20-23 * * 1-5"     # 05:00-08:50 KST Tuesday-Saturday
    - cron: "*/10 0-4 * * 2-6"       # 09:00-13:50 KST Tuesday-Saturday
  workflow_dispatch:
    inputs:
      test:
        description: "1 = send the current last 5 days now (a test of the bot and the format); nothing is saved"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: etf-alert
  cancel-in-progress: false

jobs:
  alert:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_PAT }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Poll (the log shows only status lines)
        run: python etf_alert.py
        env:
          SOSO_API_KEY: ${{ secrets.SOSO_API_KEY }}
          TELEGRAM_BOT_TOKEN_3: ${{ secrets.TELEGRAM_BOT_TOKEN_3 }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ETF_TEST: ${{ github.event.inputs.test == '1' && '1' || '' }}
      - name: Save the state
        if: always()
        run: |
          git config user.name "etf-bot"
          git config user.email "etf-bot@users.noreply.github.com"
          git add -f ct_lab/etf/etf_alert_state.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "ETF alert state"
            for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
          fi
