name: altshort

# Lives in the PUBLIC repo (free Actions minutes); code and data are in the PRIVATE repo (same pattern as ranker.yml).
# Bot2 idea: point-in-time backtest of "short the steady underperformers, long SOL / ETH / LINK" (SL levels, selection criteria, random-picks test, selloff weeks) + a check of your coin list. Run by hand.

on:
  workflow_dispatch:
    inputs:
      max_rel:
        description: "Never more than this better than the majors basket in any single week (empty = 0.10)"
        type: string
        default: ""
      min_down:
        description: "Weeks (of 8) below the majors basket (empty = 6)"
        type: string
        default: ""
      n_max:
        description: "Most shorts held (empty = 20)"
        type: string
        default: ""
      liq_min:
        description: "Binance 30-day median daily USD turnover that counts as liquid (empty = 500000)"
        type: string
        default: ""
      sl:
        description: "Stop loss used in the comparisons, e.g. 0.30 = a short is closed 30% above its entry (empty = 0.60)"
        type: string
        default: ""
      coins:
        description: "Your coin list, comma separated (empty = the 19 in altshort_bt.py)"
        type: string
        default: ""
      script:
        description: "Which script to run: altshort_bt.py (selection / SL tests, default) or altshort_hold.py (weekly reselect vs daily swaps vs no swaps)"
        type: string
        default: ""

permissions:
  contents: read

concurrency:
  group: altshort
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_PAT }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install pandas numpy requests openpyxl matplotlib scipy
      - name: Run the backtest (the log is kept in the private repo, not printed here)
        run: |
          mkdir -p rk_lab/altshort
          script="${ALT_SCRIPT:-altshort_bt.py}"
          [ -f "rk_lab/bot2/$(basename "$script")" ] && script="rk_lab/bot2/$(basename "$script")"   # the scripts live in rk_lab/bot2/
          script_name="$(basename "$script")"
          name="${script_name%.py}"; [ "$name" = "altshort_bt" ] && name="altshort"
          log="rk_lab/altshort/${name}_last_run.log"
          set +e
          python "$script" > "$log" 2>&1
          code=$?
          echo "$script finished with exit code $code. Full log: $log in the private repo."
          exit $code
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          ALT_MAX_REL: ${{ inputs.max_rel }}
          ALT_MIN_DOWN: ${{ inputs.min_down }}
          ALT_N_MAX: ${{ inputs.n_max }}
          ALT_LIQ_MIN: ${{ inputs.liq_min }}
          ALT_SL: ${{ inputs.sl }}
          ALT_LIST: ${{ inputs.coins }}
          ALT_SCRIPT: ${{ inputs.script }}
      - name: Save the log
        if: always()
        run: |
          git config user.name "ranking-bot"
          git config user.email "ranking-bot@users.noreply.github.com"
          git add -A rk_lab/altshort || true
          if ! git diff --cached --quiet; then
            git commit -m "Update altshort log"
            for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
          fi
