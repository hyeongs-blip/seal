name: hourstudy

# Hour-of-day study (KST) of the coins the copy-trader hosts short most: do they rise more at certain hours, weekday vs Saturday vs Sunday (run by hand).
# Reads the PRIVATE repo's saved host ledgers, writes nothing back, sends the result to Telegram. The log shows counts only.

on:
  workflow_dispatch:
    inputs:
      days:
        description: "Days of 30-minute candles"
        default: "180"
      topn:
        description: "Coins in the study: 2/3 the hosts short most + 1/3 dashboard gainer/loser regulars"
        default: "40"

concurrency:
  group: hourstudy
  cancel-in-progress: false

env:
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  TG_PY: |
    import json, os, sys, uuid, urllib.error, urllib.parse, urllib.request
    tok, chat = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip(), os.environ.get("TELEGRAM_CHAT_ID", "").strip()
    if not tok or not chat:
        sys.exit("The TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID secrets are empty in this repo")
    text, files = sys.argv[1], [f for f in sys.argv[2:] if os.path.exists(f)]
    if text.endswith(".txt") and os.path.exists(text):
        text = open(text, encoding="utf-8").read()
    def call(method, fields, path=None):
        if path is None:
            req = urllib.request.Request(f"https://api.telegram.org/bot{tok}/{method}", data=urllib.parse.urlencode(fields).encode())
        else:
            b = uuid.uuid4().hex
            body = b"".join(f'--{b}\r\nContent-Disposition: form-data; name="{k}"\r\n\r\n{v}\r\n'.encode() for k, v in fields.items())
            body += (f'--{b}\r\nContent-Disposition: form-data; name="document"; filename="{os.path.basename(path)}"\r\n'
                     f'Content-Type: application/octet-stream\r\n\r\n').encode() + open(path, "rb").read() + f"\r\n--{b}--\r\n".encode()
            req = urllib.request.Request(f"https://api.telegram.org/bot{tok}/{method}", data=body,
                                         headers={"Content-Type": f"multipart/form-data; boundary={b}"})
        try:
            with urllib.request.urlopen(req, timeout=120) as r:
                return json.load(r)
        except urllib.error.HTTPError as e:            # never print the URL: it contains the bot token
            sys.exit(f"Telegram refused {method}: HTTP {e.code} {e.read()[:200]!r}")
    if files and len(text) <= 1000:                    # short text rides along as the file's caption
        call("sendDocument", {"chat_id": chat, "caption": text}, files[0])
        files = files[1:]
    else:
        for i in range(0, min(len(text), 12000), 4000):
            call("sendMessage", {"chat_id": chat, "text": text[i:i + 4000], "disable_web_page_preview": "true"})
    for f in files:
        call("sendDocument", {"chat_id": chat}, f)
    print("Sent to Telegram:", len(text), "characters,", len(sys.argv[2:]), "file(s)")

jobs:
  hourstudy:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_PAT }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests openpyxl
      - name: Which exchanges this runner can reach (HTTP status only)
        continue-on-error: true
        run: |
          for u in "https://api.bybit.com/v5/market/tickers?category=linear" "https://api.binance.com/api/v3/time" "https://fapi.binance.com/fapi/v1/time" "https://www.binance.com/bapi/futures/v1/friendly/future/copy-trade/lead-portfolio/detail?portfolioId=0" "https://data.binance.vision/data/futures/um/daily/klines/BTCUSDT/30m/BTCUSDT-30m-2026-11-10.zip" "https://api.hyperliquid.xyz/info" "https://api.bitget.com/api/v2/spot/public/time"; do
            echo "$(curl -s -m 15 -o /dev/null -w '%{http_code}' -A 'Mozilla/5.0' "$u") ${u%%\?*}"
          done
      - name: Study
        env:
          DAYS: ${{ github.event.inputs.days || '180' }}
          TOPN: ${{ github.event.inputs.topn || '40' }}
          OUT_DIR: out
        run: |
          mkdir -p out
          python hour_study.py
      - name: Send to Telegram
        run: |
          python -c "$TG_PY" out/ct_hour_study.txt out/ct_hour_study.xlsx
      - name: Send a failure notice to Telegram
        if: failure()
        run: |
          python -c "$TG_PY" "hour study FAILED. Run page: $RUN_URL"
