name: perp-intraday

# Lives in the PUBLIC repo (free Actions minutes); code and data are in the PRIVATE repo (see perp.yml).

on:
  schedule:
    - cron: "7 * * * *"    # fallback: every hour at :07 (GitHub often starts it late or drops it)
    - cron: "37 * * * *"   # fallback: a second chance half an hour later. intraday_poll.py skips a run when a poll already ran in the same clock hour (or under 20 minutes ago)
  workflow_dispatch:       # "Run workflow" button = on demand; the phone (Termux, every hour at :02) starts it with source=phone
    inputs:
      source:
        description: "phone = started by the Termux hourly trigger (the one-poll-per-hour rule applies); empty = a manual run, which always polls"
        required: false
        default: ""

permissions:
  contents: read

concurrency:
  group: perp-intraday     # never two polls at once
  cancel-in-progress: false

jobs:
  poll:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_PAT }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests openpyxl
      - name: Poll (the log is only kept when something fails)
        run: |
          set +e
          python intraday_poll.py > "$RUNNER_TEMP/poll.log" 2>&1
          code=$?
          if [ $code -ne 0 ]; then mkdir -p data/perp; cp "$RUNNER_TEMP/poll.log" data/perp/intraday_last_error.log; fi
          echo "intraday_poll.py finished with exit code $code."
          # the log of this repo is public: only the lines about exchanges, credits and alerts are shown here, never the positions chat line
          grep -E "pairs, |^Done|^Skipped|^No watch|^Watch list|^Alerts|^Notes|stopped" "$RUNNER_TEMP/poll.log" | cut -c1-300 || true
          exit $code
        env:
          CMC_API_KEY: ${{ secrets.CMC_API_KEY }}
          CMC_API_KEY_2: ${{ secrets.CMC_API_KEY_2 }}
          CMC_API_KEY_3: ${{ secrets.CMC_API_KEY_3 }}
          CMC_API_KEY_4: ${{ secrets.CMC_API_KEY_4 }}
          CMC_API_KEY_5: ${{ secrets.CMC_API_KEY_5 }}
          CMC_API_KEY_6: ${{ secrets.CMC_API_KEY_6 }}
          CMC_API_KEY_7: ${{ secrets.CMC_API_KEY_7 }}
          CMC_API_KEY_8: ${{ secrets.CMC_API_KEY_8 }}
          CMC_API_KEY_9: ${{ secrets.CMC_API_KEY_9 }}
          CMC_API_KEY_10: ${{ secrets.CMC_API_KEY_10 }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}              # reads your positions chat (positions_chat.py)
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          TELEGRAM_POSITIONS_BOT_TOKEN: ${{ secrets.TELEGRAM_POSITIONS_BOT_TOKEN }}    # optional: a second bot just for the positions chat (empty = TELEGRAM_BOT_TOKEN)
          TELEGRAM_POSITIONS_CHAT: ${{ secrets.TELEGRAM_POSITIONS_CHAT }}    # optional: id of the positions chat (empty = any chat except the report chat)
          TELEGRAM_OWNER_ID: ${{ secrets.TELEGRAM_OWNER_ID }}                # optional: your Telegram user id (empty = TELEGRAM_CHAT_ID when it is a private chat)
          INTRADAY_FORCE: ${{ github.event_name == 'workflow_dispatch' && github.event.inputs.source != 'phone' && '1' || '' }}      # a manual run always polls; the phone trigger keeps the one-poll-per-hour rule
          INTRADAY_ALERTS: drivers      # Telegram message when the flag of an exchange driving one of your coins changes: drivers | all (every flagged exchange of your coins) | off
      - name: Save snapshots
        if: always()
        run: |
          git config user.name "perp-bot"
          git config user.email "perp-bot@users.noreply.github.com"
          git add -f -A data/perp/intraday data/perp/intraday_last_error.log 2>/dev/null || git add -f -A data/perp/intraday
          git add -f data/perp/my_positions.json 2>/dev/null || true
          git add -f data/perp/intraday_alerts.json 2>/dev/null || true
          if ! git diff --cached --quiet; then
            git commit -m "Hourly perp snapshot"
            for i in 1 2 3; do git pull --rebase && git push && break; sleep 5; done
          fi
