name: hivemind

# Hourly: the hivemind check for every coin with an expert model (data/experts/*_model.json): Telegram only when a call opens or
# closes. Lives in the PUBLIC repo (free Actions minutes); code and data are in the PRIVATE repo.

on:
  workflow_dispatch:          # "Run workflow" button in the Actions tab
  schedule:
    - cron: "23 * * * *"      # every hour at :23; GitHub sometimes starts it late or skips one, which is fine for swings

concurrency:
  group: hivemind
  cancel-in-progress: false

env:
  TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN_3 }}     # bot 3: hivemind calls
  TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
  RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
  TG_PY: |
    import json, os, sys, uuid, urllib.error, urllib.parse, urllib.request
    tok, chat = os.environ.get("TELEGRAM_BOT_TOKEN", "").strip(), os.environ.get("TELEGRAM_CHAT_ID", "").strip()
    if not tok or not chat:
        sys.exit("The TELEGRAM_BOT_TOKEN / TELEGRAM_CHAT_ID secrets are empty in this repo")
    text, files = sys.argv[1], [f for f in sys.argv[2:] if os.path.exists(f)]
    if text.endswith(".txt") and os.path.exists(text):
        text = open(text, encoding="utf-8").read()
    def call(method, fields, path=None):
        if path is None:
            req = urllib.request.Request(f"https://api.telegram.org/bot{tok}/{method}", data=urllib.parse.urlencode(fields).encode())
        else:
            b = uuid.uuid4().hex
            body = b"".join(f'--{b}\r\nContent-Disposition: form-data; name="{k}"\r\n\r\n{v}\r\n'.encode() for k, v in fields.items())
            body += (f'--{b}\r\nContent-Disposition: form-data; name="document"; filename="{os.path.basename(path)}"\r\n'
                     f'Content-Type: application/octet-stream\r\n\r\n').encode() + open(path, "rb").read() + f"\r\n--{b}--\r\n".encode()
            req = urllib.request.Request(f"https://api.telegram.org/bot{tok}/{method}", data=body,
                                         headers={"Content-Type": f"multipart/form-data; boundary={b}"})
        try:
            with urllib.request.urlopen(req, timeout=120) as r:
                return json.load(r)
        except urllib.error.HTTPError as e:            # never print the URL: it contains the bot token
            sys.exit(f"Telegram refused {method}: HTTP {e.code} {e.read()[:200]!r}")
    if files and len(text) <= 1000:                    # short text rides along as the file's caption
        call("sendDocument", {"chat_id": chat, "caption": text}, files[0])
        files = files[1:]
    else:
        for i in range(0, min(len(text), 12000), 4000):
            call("sendMessage", {"chat_id": chat, "text": text[i:i + 4000], "disable_web_page_preview": "true"})
    for f in files:
        call("sendDocument", {"chat_id": chat}, f)
    print("Sent to Telegram:", len(text), "characters,", len(sys.argv[2:]), "file(s)")

jobs:
  hivemind:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read          # this repo is only read; the private repo is written with the PRIVATE_PAT token
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_PAT }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests openpyxl
      - name: Hivemind check (the log is kept in the private repo, not printed here)
        run: |
          mkdir -p data/experts
          if ! ls data/experts/*_model.json >/dev/null 2>&1; then echo "No expert models yet"; exit 0; fi
          set +e
          python hivemind.py --live > data/experts/live_last.log 2>&1
          code=$?
          echo "hivemind.py --live finished with exit code $code"
          exit $code
      - name: Save the results to the repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add data/experts/live_state.json data/experts/live_scores.csv data/experts/live_last.log 2>/dev/null || true
          if git diff --cached --quiet; then
            echo "Nothing new"
          else
            git commit -q -m "hivemind $(date -u +%F_%H)"
            for i in 1 2 3; do git pull -q --rebase && git push -q && break; git rebase --abort 2>/dev/null; sleep 5; done
          fi
      - name: Send calls to Telegram (only when a call opens or closes)
        run: |
          if [ -f hivemind_live.txt ]; then python -c "$TG_PY" hivemind_live.txt; else echo "No news"; fi
          if [ -f data/experts/live_failing ]; then
            git rm -q data/experts/live_failing && git commit -q -m "hivemind recovered" \
              && for i in 1 2 3; do git pull -q --rebase && git push -q && break; git rebase --abort 2>/dev/null; sleep 5; done
            python -c "$TG_PY" "hivemind check is working again."
          fi
      - name: Send a failure notice to Telegram (once, not every hour)
        if: failure()
        run: |
          if [ ! -f data/experts/live_failing ]; then
            python -c "$TG_PY" "$(printf 'hivemind check FAILED (no more notices until it works again). Run page: %s\n\nLast lines of the log:\n' "$RUN_URL"; tail -n 30 data/experts/live_last.log 2>/dev/null || echo '(no log)')"
            date -u > data/experts/live_failing
            git add data/experts/live_failing && git commit -q -m "hivemind failing" \
              && for i in 1 2 3; do git pull -q --rebase && git push -q && break; git rebase --abort 2>/dev/null; sleep 5; done
          fi
