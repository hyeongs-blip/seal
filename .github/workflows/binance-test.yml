name: binance-test

# One-off check: can GitHub's servers read Binance's copy-trading pages? Run it once from the Actions tab, then delete this file.

on:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Try the copy-trading addresses from GitHub
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python3 - <<'EOF'
          import json, os, urllib.error, urllib.parse, urllib.request
          PID = "5240448882690502145"
          H = {"User-Agent": "Mozilla/5.0", "clienttype": "web", "lang": "en", "Content-Type": "application/json"}
          F = "/bapi/futures/v1/friendly/future/copy-trade"
          tests = []
          for host in ("https://www.binance.com", "https://www.binance.info"):
              tests += [
                  (f"{host} detail", "GET", f"{host}{F}/lead-portfolio/detail?portfolioId={PID}", None),
                  (f"{host} trade history", "POST", f"{host}{F}/lead-portfolio/position-history",
                   {"pageNumber": 1, "pageSize": 5, "portfolioId": PID}),
                  (f"{host} trader list", "POST", f"{host}{F}/home-page/query-list",
                   {"pageNumber": 1, "pageSize": 5, "timeRange": "30D", "dataType": "AUM", "favoriteOnly": False, "hideFull": False,
                    "nickname": "", "order": "DESC", "userAsset": 0, "portfolioType": "PUBLIC", "useAiRecommended": False}),
              ]
          tests.append(("fapi 1-minute prices", "GET", "https://fapi.binance.com/fapi/v1/klines?symbol=BTCUSDT&interval=1m&limit=2", None))
          lines = []
          for name, method, url, body in tests:
              req = urllib.request.Request(url, data=json.dumps(body).encode() if body else None, headers=H, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=20) as r:
                      txt = r.read().decode()[:120]
                      lines.append(f"OK  {r.status}  {name}: {txt}")
              except urllib.error.HTTPError as e:
                  lines.append(f"BLOCKED {e.code}  {name}: {e.read().decode(errors='replace')[:120]}")
              except Exception as e:
                  lines.append(f"FAILED  {name}: {str(e)[:120]}")
          msg = "Binance copy-trading test from GitHub:\n" + "\n".join(lines)
          print(msg)
          tok, chat = os.environ.get("TELEGRAM_BOT_TOKEN", ""), os.environ.get("TELEGRAM_CHAT_ID", "")
          if tok and chat:
              urllib.request.urlopen(urllib.request.Request(f"https://api.telegram.org/bot{tok}/sendMessage",
                                     data=urllib.parse.urlencode({"chat_id": chat, "text": msg[:4000]}).encode()), timeout=20)
          EOF
