name: probe-bybit
# Temporary: which Bybit addresses answer a GitHub runner.
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/124.0 Safari/537.36"
          def get(label, url):
              try:
                  r = urllib.request.urlopen(urllib.request.Request(url, headers={"User-Agent": UA, "Accept": "application/json"}), timeout=20)
                  print(f"[{label}] {r.status} {r.read(160).decode('utf-8','replace')!r}")
              except urllib.error.HTTPError as e:
                  print(f"[{label}] HTTP {e.code} {e.read(80).decode('utf-8','replace')!r}")
              except Exception as e:
                  print(f"[{label}] ERR {type(e).__name__} {str(e)[:80]}")
          for host in ("api.bybit.com", "api.bytick.com", "api.bybit.nl", "api.bybit.kz", "api.bybit-tr.com", "api.bybitgeorgia.ge"):
              get(host + " ann", f"https://{host}/v5/announcements/index?locale=en-US&limit=5&page=1")
              get(host + " tickers", f"https://{host}/v5/market/tickers?category=linear")
          PY
