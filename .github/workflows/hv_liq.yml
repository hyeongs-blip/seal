name: hv_lab liquidations

# One-off: BTC long/short liquidations per exchange from Coinalyze into otter/hv_lab/backtest/liq (for the weekend study).

on:
  workflow_dispatch:

jobs:
  fetch:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_PAT }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Fetch (log kept in the private repo)
        env:
          COINALYZE_API_KEY: ${{ secrets.COINALYZE_API_KEY }}
        run: |
          mkdir -p hv_lab/backtest/liq
          python hv_lab/backtest/liq_fetch.py > hv_lab/backtest/liq/fetch.log 2>&1
      - name: Save to the repo
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add hv_lab/backtest/liq
          git commit -q -m "hv_lab liquidations $(date -u +%F_%H%M)" || exit 0
          for i in 1 2 3 4; do git pull -q --rebase && git push -q && break; git rebase --abort 2>/dev/null; sleep 7; done
