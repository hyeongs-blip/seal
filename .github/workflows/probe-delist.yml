name: probe-delist
# Temporary: tries a few ways to read the Upbit and Binance delisting notices from a GitHub runner and prints the HTTP status and the start of each answer.
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, json
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          def get(label, url, headers=None):
              h = {"User-Agent": UA, "Accept": "application/json, text/plain, */*"}
              h.update(headers or {})
              try:
                  r = urllib.request.urlopen(urllib.request.Request(url, headers=h), timeout=20)
                  body = r.read(600).decode("utf-8", "replace").replace("\n", " ")
                  print(f"[{label}] {r.status} {body[:300]}")
              except urllib.error.HTTPError as e:
                  body = e.read(300).decode("utf-8", "replace").replace("\n", " ")
                  print(f"[{label}] HTTP {e.code} {body[:200]}")
              except Exception as e:
                  print(f"[{label}] ERR {type(e).__name__} {str(e)[:100]}")
          H = {"User-Agent": UA, "clienttype": "web", "lang": "en"}
          def J(url):
              return json.load(urllib.request.urlopen(urllib.request.Request(url, headers=H), timeout=20))
          B = "https://www.binance.com/bapi/composite/v1/public/cms/article/"
          for ps in (1, 2):
              try:
                  d = J(B + f"catalog/list/query?catalogId=161&pageNo={ps}&pageSize=20")
                  print("[page]", ps, "total", d["data"].get("total"), "n", len(d["data"]["articles"]), "first", d["data"]["articles"][0]["title"][:80])
              except Exception as e:
                  print("[page]", ps, "ERR", e)
          for code in ("b4015154ce33445ebf7b98d1bc12c072", "c30e6891afa54651ba950f8af144f861"):
              try:
                  d = J(B + "detail/query?articleCode=" + code)
                  x = d["data"]
                  print("[detail]", {k: (str(v)[:80]) for k, v in x.items() if k not in ("body",)})
              except Exception as e:
                  print("[detail] ERR", e)
          for u in ("list/query?type=1&catalogId=161&pageNo=1&pageSize=10", "list/query?catalogId=161&pageNo=1&pageSize=10", "list/query?type=1&pageNo=1&pageSize=10"):
              try:
                  d = J(B + u)
                  print("[list]", u, "ok", str(d)[:300])
              except Exception as e:
                  print("[list]", u, "ERR", e)
          try:
              d = J(B + "catalog/list/query?catalogId=161&pageNo=1&pageSize=20")
              for a in d["data"]["articles"][:6]:
                  print("[full]", json.dumps(a, ensure_ascii=False)[:400])
          except Exception as e:
              print("ERR", e)
          PY
