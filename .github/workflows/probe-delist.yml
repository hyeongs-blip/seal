name: probe-delist
# Temporary: tries a few ways to read the Upbit and Binance delisting notices from a GitHub runner and prints the HTTP status and the start of each answer.
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, json
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          def get(label, url, headers=None):
              h = {"User-Agent": UA, "Accept": "application/json, text/plain, */*"}
              h.update(headers or {})
              try:
                  r = urllib.request.urlopen(urllib.request.Request(url, headers=h), timeout=20)
                  body = r.read(600).decode("utf-8", "replace").replace("\n", " ")
                  print(f"[{label}] {r.status} {body[:300]}")
              except urllib.error.HTTPError as e:
                  body = e.read(300).decode("utf-8", "replace").replace("\n", " ")
                  print(f"[{label}] HTTP {e.code} {body[:200]}")
              except Exception as e:
                  print(f"[{label}] ERR {type(e).__name__} {str(e)[:100]}")
          H = {"User-Agent": UA, "Accept": "application/json, text/plain, */*"}
          B = "https://www.binance.com/bapi/composite/v1/public/cms/article/"
          for ps in (10, 20, 21, 30):
              try:
                  r = urllib.request.urlopen(urllib.request.Request(B + f"list/query?type=1&catalogId=161&pageNo=1&pageSize={ps}", headers=H), timeout=20)
                  d = json.load(r)
                  arts = d["data"]["catalogs"][0]["articles"]
                  print("[ps]", ps, "ok n", len(arts), "keys", list(arts[0].keys()), "release", arts[0].get("releaseDate"), arts[0]["title"][:60])
              except urllib.error.HTTPError as e:
                  print("[ps]", ps, "HTTP", e.code)
              except Exception as e:
                  print("[ps]", ps, "ERR", e)
          PY
