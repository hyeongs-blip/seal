name: probe-delist
# Temporary: tries a few ways to read the Upbit and Binance delisting notices from a GitHub runner and prints the HTTP status and the start of each answer.
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, json
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          def get(label, url, headers=None):
              h = {"User-Agent": UA, "Accept": "application/json, text/plain, */*"}
              h.update(headers or {})
              try:
                  r = urllib.request.urlopen(urllib.request.Request(url, headers=h), timeout=20)
                  body = r.read(600).decode("utf-8", "replace").replace("\n", " ")
                  print(f"[{label}] {r.status} {body[:300]}")
              except urllib.error.HTTPError as e:
                  body = e.read(300).decode("utf-8", "replace").replace("\n", " ")
                  print(f"[{label}] HTTP {e.code} {body[:200]}")
              except Exception as e:
                  print(f"[{label}] ERR {type(e).__name__} {str(e)[:100]}")
          UPA = "https://api-manager.upbit.com/api/v1/announcements?os=web&page=1&per_page=20&category=trade"
          for h in ("sg-api-manager","id-api-manager","th-api-manager","api-manager"):
              get(h, f"https://{h}.upbit.com/api/v1/announcements?os=web&page=1&per_page=20&category=trade")
          get("api.upbit market", "https://api.upbit.com/v1/market/all?isDetails=true")
          get("upbit sg notice", "https://sg.upbit.com/service_center/notice")
          get("upbit support", "https://upbit.com/service_center/notice?id=1")
          get("bithumb notice", "https://feed.bithumb.com/notice")
          get("bithumb api", "https://api.bithumb.com/v1/market/all?isDetails=true")
          BC = "https://www.binance.com/bapi/composite/v1/public/cms/article/catalog/list/query?catalogId=161&pageNo=1&pageSize=15"
          try:
              d = json.load(urllib.request.urlopen(urllib.request.Request(BC, headers={"User-Agent": UA, "clienttype": "web", "lang": "en"}), timeout=20))
              for a in d["data"]["articles"][:15]:
                  print("[binance art]", a.get("id"), a.get("code"), a.get("releaseDate"), (a.get("title") or "")[:110])
              print("[binance keys]", list(d["data"]["articles"][0].keys()), "total", d["data"].get("total"))
          except Exception as e:
              print("[binance art] ERR", e)
          PY
