name: probe-delist
# Temporary: tries a few ways to read the Upbit and Binance delisting notices from a GitHub runner and prints the HTTP status and the start of each answer.
on:
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Probe
        run: |
          python3 - <<'PY'
          import urllib.request, urllib.error, json
          UA = "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/124.0 Safari/537.36"
          def get(label, url, headers=None):
              h = {"User-Agent": UA, "Accept": "application/json, text/plain, */*"}
              h.update(headers or {})
              try:
                  r = urllib.request.urlopen(urllib.request.Request(url, headers=h), timeout=20)
                  body = r.read(600).decode("utf-8", "replace").replace("\n", " ")
                  print(f"[{label}] {r.status} {body[:300]}")
              except urllib.error.HTTPError as e:
                  body = e.read(300).decode("utf-8", "replace").replace("\n", " ")
                  print(f"[{label}] HTTP {e.code} {body[:200]}")
              except Exception as e:
                  print(f"[{label}] ERR {type(e).__name__} {str(e)[:100]}")
          UP = "https://api-manager.upbit.com/api/v1/announcements?os=web&page=1&per_page=20&category=trade"
          get("upbit plain", UP)
          get("upbit ko headers", UP, {"Accept-Language": "ko-KR,ko;q=0.9", "Origin": "https://upbit.com", "Referer": "https://upbit.com/service_center/notice"})
          get("upbit notices", "https://api-manager.upbit.com/api/v1/notices?page=1&per_page=20", {"Accept-Language": "ko-KR,ko;q=0.9", "Origin": "https://upbit.com", "Referer": "https://upbit.com/"})
          get("upbit html", "https://upbit.com/service_center/notice", {"Accept": "text/html", "Accept-Language": "ko-KR,ko;q=0.9"})
          get("upbit info", "https://api-manager.upbit.com/api/v1/announcements?os=web&page=1&per_page=20&category=all", {"Accept-Language": "ko-KR", "Referer": "https://upbit.com/"})
          B = "https://www.binance.com/bapi/composite/v1/public/cms/article/list/query"
          get("binance now", B + "?type=1&catalogId=161&pageNo=1&pageSize=30")
          get("binance headers", B + "?type=1&catalogId=161&pageNo=1&pageSize=30", {"clienttype": "web", "lang": "en", "Accept-Language": "en-US,en;q=0.9", "Referer": "https://www.binance.com/en/support/announcement"})
          get("binance catalog", "https://www.binance.com/bapi/composite/v1/public/cms/article/catalog/list/query?catalogId=161&pageNo=1&pageSize=30", {"clienttype": "web", "lang": "en"})
          get("binance apex", "https://www.binance.com/bapi/apex/v1/public/apex/cms/article/list/query?type=1&catalogId=161&pageNo=1&pageSize=30", {"clienttype": "web", "lang": "en"})
          get("binance html", "https://www.binance.com/en/support/announcement/delisting?c=161&navId=161", {"Accept": "text/html", "Accept-Language": "en-US,en;q=0.9"})
          get("binance.com ip", "https://www.binance.com/bapi/composite/v1/public/cms/article/list/query?type=1&catalogId=48&pageNo=1&pageSize=5")
          PY
