name: bybit-probe
on:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - run: |
          for h in api.bybit.com api.bytick.com api.bybit.nl; do
            code=$(curl -s -m 15 -o /tmp/o.json -w "%{http_code}" "https://$h/v5/market/tickers?category=linear" || true)
            echo "$h -> HTTP $code, $(head -c 120 /tmp/o.json)"
          done
