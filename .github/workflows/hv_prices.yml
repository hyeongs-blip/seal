name: hv_lab prices

# Fetches hourly prices for the hivemind back-tests into otter/hv_lab/backtest/prices (Gate futures is reachable from here, not from Claude's sandbox).

on:
  workflow_dispatch:
    inputs:
      lists:
        description: "Coin list files, space separated"
        default: "hv_lab/backtest/coins_hot.txt hv_lab/backtest/coins_stocks.txt"
      start_ms:
        description: "Start, ms"
        required: true
      end_ms:
        description: "End, ms"
        required: true

concurrency:
  group: hv_prices
  cancel-in-progress: false

jobs:
  prices:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          repository: ${{ secrets.PRIVATE_REPO }}
          token: ${{ secrets.PRIVATE_PAT }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install requests
      - name: Fetch prices (log kept in the private repo)
        env:
          LISTS: ${{ github.event.inputs.lists }}
          A: ${{ github.event.inputs.start_ms }}
          B: ${{ github.event.inputs.end_ms }}
        run: |
          mkdir -p hv_lab/backtest/prices
          for f in $LISTS; do python hv_lab/fetch_prices.py "$f" "$A" "$B" >> hv_lab/backtest/prices/_fetch.log 2>&1; done
      - name: Save to the repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git add hv_lab/backtest/prices
          git commit -q -m "hv_lab prices $(date -u +%F_%H%M)" || exit 0
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; git rebase --abort 2>/dev/null; sleep 5; done
